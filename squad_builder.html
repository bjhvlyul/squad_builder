<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Squad Builder">
<title>Squad Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeede8;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#0F6E56;--green-text:#085041;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
    --green-light:#0a3d2a;--green-text:#5DCAA5;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);min-height:100vh;color:var(--text)}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg3);display:flex;flex-direction:column}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.topbar-icon{width:34px;height:34px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.topbar h1{font-size:17px;font-weight:600;color:var(--text);flex:1}
.topbar-count{font-size:12px;font-weight:600;color:var(--green-text);background:var(--green-light);padding:4px 10px;border-radius:20px}
.content{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.card-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.config-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border)}
.config-row:last-child{border-bottom:none;padding-bottom:0}
.config-label{font-size:15px;font-weight:500;color:var(--text)}
.config-sub{font-size:12px;color:var(--text3);margin-top:2px}
.stepper{display:flex;align-items:center;gap:12px}
.step-btn{width:32px;height:32px;border-radius:50%;border:0.5px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;line-height:1;color:var(--text);user-select:none;-webkit-user-select:none}
.step-btn:active{transform:scale(.88);background:var(--bg3)}
.step-val{font-size:16px;font-weight:600;color:var(--green);min-width:22px;text-align:center}
.select-row{display:flex;gap:8px;margin-bottom:12px}
.sel-btn{flex:1;padding:8px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;text-align:center}
.sel-btn:active{background:var(--bg3)}
.player-list{display:flex;flex-direction:column}
.player-item{display:flex;align-items:center;padding:9px 0;border-bottom:0.5px solid var(--border);cursor:pointer;user-select:none;-webkit-user-select:none}
.player-item:last-child{border-bottom:none}
.player-item:active{opacity:.7}
.p-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:10px;transition:all .15s}
.p-check.on{background:var(--green);border-color:var(--green)}
.p-check.on::after{content:'';display:block;width:5px;height:10px;border:2.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px)}
.p-avatar{width:30px;height:30px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--green-text);flex-shrink:0;margin-right:9px}
.p-avatar.off{background:var(--bg2);color:var(--text3)}
.p-name{flex:1;font-size:14px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-name.off{color:var(--text3)}
.p-score{font-size:12px;color:var(--text3);flex-shrink:0;margin-left:4px}
.p-score.on{color:var(--green);font-weight:600}
.preview-box{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;font-size:13px;color:var(--text2);text-align:center}
.preview-box strong{color:var(--text)}
.preview-box.warn{background:#FAECE7;border-color:#F5C4B3;color:#712B13}
.preview-box.warn strong{color:#4A1B0C}
.btn-primary{width:100%;padding:15px;border-radius:var(--radius-lg);border:none;background:var(--green);color:#fff;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none}
.btn-primary:active{transform:scale(.98);background:var(--green-dark)}
.btn-primary:disabled{background:var(--bg2);color:var(--text3);cursor:not-allowed;transform:none}
.btn-ghost{flex:1;padding:13px;border-radius:var(--radius-lg);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none}
.btn-ghost:active{background:var(--bg2)}
.squad-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px}
.squad-card.top-squad{border-color:var(--green);border-width:1.5px}
.squad-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.squad-name{font-size:15px;font-weight:600;color:var(--text)}
.squad-meta{font-size:12px;color:var(--text3);margin-left:6px}
.squad-total{font-size:13px;font-weight:600}
.player-row{display:flex;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border)}
.player-row:last-child{border-bottom:none}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-right:10px}
.pname{font-size:13px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pscore{font-size:12px;font-weight:600;color:var(--green);margin-left:6px;flex-shrink:0}
.cats{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.cat{font-size:10px;padding:2px 5px;border-radius:4px;background:var(--bg2);color:var(--text3)}
.bench-card{background:var(--bg2);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px}
.bench-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:8px}
.bench-p{font-size:13px;color:var(--text2);padding:4px 0;border-bottom:0.5px solid var(--border)}
.bench-p:last-child{border-bottom:none}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:var(--bg2);border-radius:var(--radius);padding:12px;text-align:center}
.stat-box .v{font-size:22px;font-weight:600;color:var(--text)}
.stat-box .l{font-size:11px;color:var(--text3);margin-top:2px}
.balance-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px}
.bar-bg{height:7px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-bottom:14px}
.bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill-g{background:var(--green-light);color:var(--green-text)}
.pill-a{background:#FAEEDA;color:#633806}
.pill-r{background:#FAECE7;color:#712B13}
.screen{display:none}
.screen.active{display:block}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-icon">&#9917;</div>
    <h1>Squad Builder</h1>
    <span class="topbar-count" id="top-count">0 selected</span>
  </div>

  <div class="content">

    <div class="screen active" id="screen-setup">
      <div class="card">
        <div class="card-title">Match settings</div>
        <div class="config-row">
          <div>
            <div class="config-label">Number of squads</div>
            <div class="config-sub">How many teams to create</div>
          </div>
          <div class="stepper">
            <div class="step-btn" onclick="change('squads',-1)">&#8722;</div>
            <span class="step-val" id="val-squads">2</span>
            <div class="step-btn" onclick="change('squads',1)">+</div>
          </div>
        </div>
        <div class="config-row">
          <div>
            <div class="config-label">Players per squad</div>
            <div class="config-sub">Starting lineup size (4&#8211;10)</div>
          </div>
          <div class="stepper">
            <div class="step-btn" onclick="change('size',-1)">&#8722;</div>
            <span class="step-val" id="val-size">5</span>
            <div class="step-btn" onclick="change('size',1)">+</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Select players for this match</div>
        <div class="select-row">
          <div class="sel-btn" onclick="selectAll()">&#10003; Select all</div>
          <div class="sel-btn" onclick="clearAll()">&#10005; Clear all</div>
        </div>
        <div class="player-list" id="player-list"></div>
      </div>

      <div class="preview-box" id="preview-box"></div>

      <button class="btn-primary" id="gen-btn" onclick="generateSquads()" disabled>
        &#9654; Generate balanced squads
      </button>
    </div>

    <div class="screen" id="screen-results">
      <div class="card" style="padding:12px 14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <span style="font-size:15px;font-weight:600;color:var(--text)">Balance result</span>
          <span id="balance-pill" class="pill pill-g"></span>
        </div>
        <div class="balance-row"><span>Weakest squad</span><span>Strongest squad</span></div>
        <div class="bar-bg"><div class="bar-fill" id="bar-fill" style="width:100%;background:var(--green)"></div></div>
        <div class="stat-grid">
          <div class="stat-box"><div class="v" id="s-playing">0</div><div class="l">Playing</div></div>
          <div class="stat-box"><div class="v" id="s-squads">0</div><div class="l">Squads</div></div>
          <div class="stat-box"><div class="v" id="s-size">0</div><div class="l">Per squad</div></div>
          <div class="stat-box"><div class="v" id="s-diff">0%</div><div class="l">Rating diff</div></div>
        </div>
      </div>

      <div id="squads-container"></div>

      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-ghost" onclick="generateSquads()">&#8635; Re-shuffle</button>
        <button class="btn-ghost" onclick="backToSetup()">&#8592; Settings</button>
      </div>
    </div>

  </div>
</div>

<script>
const allPlayers=[
  {ar:'أحمد البريس',f:85,s:60,k:70,g:70,p:80},
  {ar:'أحمد الروبيس',f:85,s:85,k:80,g:70,p:90},
  {ar:'أحمد سيد أبو سكر',f:75,s:70,k:90,g:50,p:80},
  {ar:'أحمد عامر',f:75,s:85,k:80,g:70,p:70},
  {ar:'أحمد المدرس',f:80,s:60,k:75,g:75,p:70},
  {ar:'إسلام أحمير',f:80,s:90,k:75,g:75,p:70},
  {ar:'عمر السراوان',f:70,s:60,k:80,g:70,p:70},
  {ar:'السيد الوائل',f:70,s:80,k:70,g:70,p:70},
  {ar:'السيد مصطفى',f:60,s:85,k:80,g:75,p:85},
  {ar:'الشيخ محمد',f:75,s:70,k:85,g:65,p:80},
  {ar:'الشيخ إبراهيم زكي',f:70,s:60,k:60,g:60,p:60},
  {ar:'الشيخ إسلام الغنا',f:85,s:80,k:60,g:60,p:80},
  {ar:'عمرو عامر',f:70,s:60,k:80,g:60,p:80},
  {ar:'ياسر الشناوي',f:65,s:60,k:70,g:60,p:60},
  {ar:'مريم',f:80,s:70,k:50,g:50,p:60},
  {ar:'حسام زميل سليم',f:85,s:70,k:50,g:50,p:80},
  {ar:'حسين زميل عبد الرحيم',f:70,s:50,k:80,g:75,p:70},
  {ar:'أحمد غزال',f:80,s:70,k:80,g:70,p:80},
  {ar:'محمد بلبي',f:80,s:60,k:80,g:50,p:80},
  {ar:'مدحت خنور',f:80,s:60,k:70,g:50,p:80},
  {ar:'بدر رشيد',f:75,s:70,k:60,g:60,p:80},
  {ar:'عمر الشناوي',f:70,s:70,k:70,g:80,p:50},
  {ar:'أحمد عبد الرحيم',f:75,s:70,k:85,g:80,p:80},
  {ar:'مهند عبد الله',f:25,s:90,k:85,g:70,p:90},
  {ar:'زياد صالح',f:75,s:60,k:70,g:70,p:80},
  {ar:'أحمد مؤمن',f:60,s:60,k:70,g:74,p:80},
  {ar:'شريف البرهامي',f:70,s:85,k:85,g:80,p:80},
  {ar:'صلاح أبوكرو',f:70,s:60,k:60,g:60,p:60},
  {ar:'عالم إبراهيم',f:75,s:70,k:80,g:60,p:70},
  {ar:'عبد الغالم',f:60,s:80,k:80,g:75,p:75},
  {ar:'عمرو تودت',f:75,s:70,k:80,g:75,p:60},
  {ar:'فتح العقص',f:75,s:75,k:60,g:60,p:70},
  {ar:'محمد أحمد',f:70,s:75,k:60,g:60,p:75},
  {ar:'محمد العبد',f:75,s:90,k:75,g:80,p:80},
  {ar:'عمر قران',f:70,s:70,k:80,g:70,p:80},
  {ar:'عمر الياجورون',f:70,s:80,k:70,g:70,p:80},
  {ar:'محمد الشادلي',f:85,s:80,k:70,g:70,p:80},
  {ar:'محمود الشادلي',f:80,s:90,k:80,g:75,p:80},
  {ar:'محسن سالم',f:80,s:70,k:90,g:80,p:80},
  {ar:'محسن سامي',f:85,s:90,k:85,g:25,p:85},
  {ar:'أحمد سراح',f:70,s:75,k:80,g:70,p:85},
  {ar:'شريف شكر',f:85,s:80,k:85,g:80,p:82},
  {ar:'سعيد الهيكل',f:85,s:80,k:85,g:85,p:85},
  {ar:'علي عباود',f:85,s:70,k:80,g:70,p:75},
  {ar:'محمد كبيدة',f:85,s:70,k:75,g:70,p:75},
  {ar:'يوسف أسامة إسلام',f:75,s:80,k:85,g:70,p:70},
  {ar:'يوسف إسماعيل',f:70,s:75,k:70,g:80,p:80},
  {ar:'محمد حمزة',f:80,s:70,k:80,g:80,p:80},
  {ar:'عبد المورث',f:80,s:65,k:60,g:60,p:70},
  {ar:'عبد الوارث',f:80,s:80,k:60,g:60,p:80},
  {ar:'يوسف صالح',f:85,s:60,k:60,g:69,p:75},
  {ar:'محمود موريس',f:60,s:90,k:80,g:80,p:80},
  {ar:'مود مشبة',f:80,s:80,k:80,g:80,p:80}
];

const a2e={'أ':'a','إ':'i','آ':'aa','ا':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'a','ة':'a','ء':'','ئ':'y','ؤ':'w','ً':'','ٌ':'','ٍ':'','َ':'a','ُ':'u','ِ':'i','ّ':'','ْ':'','ـ':''};
function tr(s){let r='';for(const c of s)r+=a2e[c]!==undefined?a2e[c]:c;r=r.replace(/[^\x00-\x7F]/g,'').trim();return r?r.charAt(0).toUpperCase()+r.slice(1):s}

const players=allPlayers.map((p,i)=>({...p,id:i,name:tr(p.ar),total:p.f+p.s+p.k+p.g+p.p}));
const selected=new Set(players.map(p=>p.id));
let numSquads=2,squadSize=5;

function renderList(){
  const list=document.getElementById('player-list');
  list.innerHTML='';
  players.forEach(p=>{
    const on=selected.has(p.id);
    const row=document.createElement('div');
    row.className='player-item';
    row.onclick=()=>togglePlayer(p.id);
    const init=p.name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
    row.innerHTML=`<div class="p-check${on?' on':''}"></div><div class="p-avatar${on?'':' off'}">${init}</div><span class="p-name${on?'':' off'}">${p.name}</span><span class="p-score${on?' on':''}">${p.total}</span>`;
    list.appendChild(row);
  });
  updateTopCount();
  updatePreview();
}

function togglePlayer(id){
  selected.has(id)?selected.delete(id):selected.add(id);
  renderList();
}

function selectAll(){players.forEach(p=>selected.add(p.id));renderList();}
function clearAll(){selected.clear();renderList();}

function updateTopCount(){
  document.getElementById('top-count').textContent=selected.size+' selected';
}

function updatePreview(){
  const n=selected.size;
  const needed=numSquads*squadSize;
  const bench=n-needed;
  const box=document.getElementById('preview-box');
  const btn=document.getElementById('gen-btn');
  if(n<needed){
    box.className='preview-box warn';
    box.innerHTML=`Need <strong>${needed}</strong> players (${numSquads} &times; ${squadSize}) &mdash; select <strong>${needed-n}</strong> more`;
    btn.disabled=true;
  } else {
    box.className='preview-box';
    box.innerHTML=`<strong>${needed}</strong> playing &middot; ${numSquads} squads of ${squadSize}${bench>0?` &middot; <strong>${bench}</strong> on bench`:''}`;
    btn.disabled=false;
  }
}

function change(what,d){
  if(what==='squads') numSquads=Math.max(2,Math.min(6,numSquads+d));
  if(what==='size') squadSize=Math.max(4,Math.min(10,squadSize+d));
  document.getElementById('val-squads').textContent=numSquads;
  document.getElementById('val-size').textContent=squadSize;
  updatePreview();
}

function balancedDistribute(pool,n){
  const sorted=[...pool].sort((a,b)=>b.total-a.total);
  const squads=Array.from({length:n},()=>({players:[],total:0}));
  let dir=1,si=0;
  for(let i=0;i<sorted.length;i++){
    squads[si].players.push(sorted[i]);
    squads[si].total+=sorted[i].total;
    si+=dir;
    if(si>=n){si=n-1;dir=-1;}
    else if(si<0){si=0;dir=1;}
  }
  for(let pass=0;pass<300;pass++){
    const tots=squads.map(s=>s.total);
    const hi=tots.indexOf(Math.max(...tots));
    const lo=tots.indexOf(Math.min(...tots));
    if(hi===lo) break;
    const diff=squads[hi].total-squads[lo].total;
    if(diff<2) break;
    let bDiff=diff,bI=-1,bJ=-1;
    for(let i=0;i<squads[hi].players.length;i++){
      for(let j=0;j<squads[lo].players.length;j++){
        const pi=squads[hi].players[i],pj=squads[lo].players[j];
        const nd=Math.abs((squads[hi].total-pi.total+pj.total)-(squads[lo].total-pj.total+pi.total));
        if(nd<bDiff){bDiff=nd;bI=i;bJ=j;}
      }
    }
    if(bI>=0){
      const pi=squads[hi].players[bI],pj=squads[lo].players[bJ];
      squads[hi].players[bI]=pj;squads[lo].players[bJ]=pi;
      squads[hi].total+=pj.total-pi.total;
      squads[lo].total+=pi.total-pj.total;
    } else break;
  }
  return squads;
}

const COLORS=['#1D9E75','#185FA5','#D85A30','#7F77DD','#BA7517','#D4537E'];
const NAMES=['Squad A','Squad B','Squad C','Squad D','Squad E','Squad F'];

function generateSquads(){
  const pool=players.filter(p=>selected.has(p.id));
  const needed=numSquads*squadSize;
  if(pool.length<needed) return;
  const shuffled=[...pool].sort(()=>Math.random()-.5);
  const playing=shuffled.slice(0,needed);
  const bench=shuffled.slice(needed);
  const squads=balancedDistribute(playing,numSquads);
  renderResults(squads,bench);
  document.getElementById('screen-setup').classList.remove('active');
  document.getElementById('screen-results').classList.add('active');
  window.scrollTo(0,0);
}

function renderResults(squads,bench){
  const totals=squads.map(s=>s.total);
  const maxT=Math.max(...totals),minT=Math.min(...totals);
  const diffPct=maxT>0?Math.round(((maxT-minT)/maxT)*100):0;
  document.getElementById('s-playing').textContent=numSquads*squadSize;
  document.getElementById('s-squads').textContent=numSquads;
  document.getElementById('s-size').textContent=squadSize;
  document.getElementById('s-diff').textContent=diffPct+'%';
  const pill=document.getElementById('balance-pill');
  const bar=document.getElementById('bar-fill');
  if(diffPct<=5){pill.textContent='Excellent balance';pill.className='pill pill-g';bar.style.background='#1D9E75';}
  else if(diffPct<=10){pill.textContent='Good balance';pill.className='pill pill-a';bar.style.background='#EF9F27';}
  else{pill.textContent='Fair balance';pill.className='pill pill-r';bar.style.background='#D85A30';}
  bar.style.width=(maxT>0?Math.round((minT/maxT)*100):100)+'%';
  const container=document.getElementById('squads-container');
  container.innerHTML='';
  [...squads].sort((a,b)=>b.total-a.total).forEach((sq,idx)=>{
    const color=COLORS[idx%COLORS.length];
    const isTop=sq.total===maxT;
    const totalColor=sq.total===maxT?'#0F6E56':sq.total===minT?'#993C1D':'#854F0B';
    const div=document.createElement('div');
    div.className='squad-card'+(isTop?' top-squad':'');
    div.innerHTML=`<div class="squad-header"><div style="display:flex;align-items:center;gap:8px"><div style="width:11px;height:11px;border-radius:50%;background:${color}"></div><span class="squad-name">${NAMES[idx]}</span><span class="squad-meta">${sq.players.length} players</span></div><span class="squad-total" style="color:${totalColor}">&Sigma; ${Math.round(sq.total)}</span></div><div id="sp-${idx}"></div>`;
    container.appendChild(div);
    const pd=div.querySelector(`#sp-${idx}`);
    sq.players.forEach(p=>{
      const init=p.name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
      const row=document.createElement('div');
      row.className='player-row';
      row.innerHTML=`<div class="avatar" style="background:${color}22;color:${color}">${init}</div><div style="flex:1;min-width:0"><div class="pname">${p.name}</div><div class="cats"><span class="cat">F:${p.f}</span><span class="cat">S:${p.s}</span><span class="cat">K:${p.k}</span><span class="cat">G:${p.g}</span><span class="cat">P:${p.p}</span></div></div><span class="pscore">${Math.round(p.total)}</span>`;
      pd.appendChild(row);
    });
  });
  if(bench.length>0){
    const bc=document.createElement('div');
    bc.className='bench-card';
    bc.innerHTML=`<div class="bench-title">Bench (${bench.length} players)</div><div id="bl"></div>`;
    container.appendChild(bc);
    const bl=bc.querySelector('#bl');
    bench.forEach(p=>{const r=document.createElement('div');r.className='bench-p';r.textContent=p.name+' \u00B7 \u03A3'+Math.round(p.total);bl.appendChild(r);});
  }
}

function backToSetup(){
  document.getElementById('screen-results').classList.remove('active');
  document.getElementById('screen-setup').classList.add('active');
  window.scrollTo(0,0);
}

renderList();
</script>
